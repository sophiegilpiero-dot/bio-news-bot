name: Bio News Alert

on:
  schedule:
    # 2시간마다 실행 (UTC 기준, 정각 혼잡을 피해 7분에 시작)
    # 한국시간 01:07, 03:07, 05:07 … 23:07
    - cron: "7 */2 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 가능

permissions:
  contents: write  # 보낸 기사 기록(sent.json)을 저장소에 저장하기 위해 필요

concurrency:
  group: bio-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save sent log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json 2>/dev/null || exit 0
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "Update sent log [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
